<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ludo-pitara/favicon.svg" />
    <!-- Pinch-zoom is intentionally allowed: blocking it (with
         maximum-scale=1 / user-scalable=no) is a hard accessibility
         failure for low-vision users. The CSS already pins the
         playable layout and `touch-action: manipulation` on `*`
         disables double-tap-to-zoom, so user zoom is a deliberate
         gesture only. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Free Ludo, Snakes & Ladders and Dice. No ads, no sign-up, plays offline. Install it straight from your browser." />
    <!-- Link previews (X/Twitter, WhatsApp, Facebook…). Image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ludo Pitara" />
    <meta property="og:title" content="Ludo Pitara — free Ludo & Snakes and Ladders, no ads" />
    <meta property="og:description" content="Play with friends on one phone or against bots. No ads, no sign-up, works offline." />
    <meta property="og:url" content="https://udeshvirk.github.io/ludo-pitara/" />
    <meta property="og:image" content="https://udeshvirk.github.io/ludo-pitara/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ludo and Snakes & Ladders boards on a phone" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#190a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ludo Pitara" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ludo-pitara/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Ludo Pitara — Play Ludo & Snake and Ladders</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
